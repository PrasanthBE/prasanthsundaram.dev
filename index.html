  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f7f7f9; color: #111; font-family: Outfit, "Segoe UI", Arial, sans-serif; transition: opacity .5s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader b { font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; letter-spacing: -.04em; }
    #loader b i { font-style: normal; color: #ff2d20; }
    #loader span { width: 140px; height: 2px; background: rgba(0,0,0,.08); overflow: hidden; }
    #loader span::after { content: ""; display: block; width: 40%; height: 100%; background: #ff2d20; animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading portfolio"><b>PRASANTH <i>S</i></b><span></span></div>

  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      l.classList.add('done');
      setTimeout(function () { l.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
